version: 1
name: fixeol
description: fixeol normalizes line endings for one or more files, directories, or wildcard patterns
settings:
  project: fixeol.csproj
  solution: fixeol.slnx
  publish:
    project-directory: src
    project-prefix: Spark.
    release-directory: artifacts/releases
    required-documents:
      - README.md
      - LICENSE.md
  app:
    version: "3.21.yyMM.ddhh"
    git-hash: short
    dirty-suffix: true
  installer:
    config: .tasks/installer.yaml
    output: artifacts/installers
