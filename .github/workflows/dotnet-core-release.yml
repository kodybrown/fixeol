name: dotnet-core-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FixEol.slnx

      - name: Build
        run: dotnet build FixEol.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FixEol.slnx --configuration Release --no-build --verbosity normal

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ win-x64, win-x86, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64 ]
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish FixEol.csproj --nologo --configuration Release --runtime ${{ matrix.rid }} --framework net10.0 --self-contained false --output ./artifacts/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path ./artifacts/${{ matrix.rid }}/* -DestinationPath ./fixeol-${{ matrix.rid }}-${{ github.ref_name }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixeol-${{ matrix.rid }}
          path: ./fixeol-${{ matrix.rid }}-${{ github.ref_name }}.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find ./dist -name '*.zip' -type f | sort)
          gh release create "${GITHUB_REF_NAME}" $files --title "Release ${GITHUB_REF_NAME}" --notes "Release ${GITHUB_REF_NAME}"
